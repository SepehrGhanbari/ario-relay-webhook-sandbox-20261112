name: R1d fail-only publisher scaffold unit tests (unprivileged)

on:
  push:
    branches:
      - experiment/r1d-app-producer-preparation-20261113

# This tests only the public offline Python scaffold. It does NOT create,
# install or authenticate as a GitHub App, does NOT issue a Check Run via
# the Checks API, and MUST NOT be a required source-bound check.
permissions:
  contents: read

jobs:
  offline-r1d-unit-tests:
    name: r1d-offline-negative-tests-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout only this non-production publisher scaffold branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute offline mocked negative controls
        run: |
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v
