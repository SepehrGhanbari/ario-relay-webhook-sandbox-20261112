name: R1i external exact-SHA real test witness (LAB, unsigned)
on:
  push:
    branches:
      - experiment/r1i-external-evaluator-20261113

permissions:
  contents: read

jobs:
  external-real-test:
    name: r1i-external-actual-unit-test-not-trust-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout standalone evaluator source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute external script on immutable target SHA (no App secrets)
        run: python3 -I -B r1i_external_eval.py
      - name: Retain raw test log and unsigned machine-readable observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1i-disposable-external-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
