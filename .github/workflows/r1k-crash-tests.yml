name: R1k crash restart and concurrent-journal fault injection (LAB ONLY)
on:
  push:
    branches:
      - experiment/r1k-crash-restart-concurrency-20261113

permissions:
  contents: read

jobs:
  ubuntu-crash-tests:
    name: r1k-ubuntu-real-process-crash-and-concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout disposable-only sources without credential retention
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute R1j plus R1k safety tests including real process crashes
        run: python3 -B -m unittest discover -s tests -p 'test_r1*.py' -v

  windows-crash-tests:
    name: r1k-windows-real-process-crash-and-concurrency
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout disposable-only sources without credential retention
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute R1j plus R1k safety tests including real process crashes
        run: python -B -m unittest discover -s tests -p 'test_r1*.py' -v
