# Untrusted candidate CI only: NOT an independent review or merge-authority check.
# PR authors can modify this workflow. Never make this job a production
# required trust gate or treat green as independent evidence admission.
name: R2a0 offline candidate tests (advisory only)

on:
  pull_request:
    paths:
      - "research/r2a0/v02/**"
      - ".github/workflows/r2a0-offline-review.yml"

permissions:
  contents: read

jobs:
  offline:
    name: R2a0 stdlib / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout the candidate (UNTRUSTED)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Execute local mock/process/loopback tests only
        working-directory: research/r2a0/v02
        run: python -m unittest discover -s tests -v
